services: 
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: django:daily
    ports: 
      - '8000:8000'
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - db

  db:
    image: postgres:15-alpine
    container_name: my-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    image: celery:worker
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - redis
      - backend

volumes:
  postgres_data: